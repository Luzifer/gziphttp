name: Publish Docker image

on:
  push: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Publish Docker image
        uses: Luzifer/actions/docker-publish@207fd028b122b60f8218cbfff0cb7401d55f29a1 # develop
        with:
          image_name: ghcr.io/luzifer/gziphttp
          registry_pass: ${{ secrets.GITHUB_TOKEN }}
          registry_user: ${{ github.actor }}
